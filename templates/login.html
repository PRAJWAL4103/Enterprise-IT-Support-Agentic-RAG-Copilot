<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — IT Support Copilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(700px 420px at 80% -10%, rgba(94,226,107,.14), transparent 60%),
                radial-gradient(600px 420px at 0% 110%, rgba(94,226,107,.09), transparent 60%),
                #060907;
            color: #eef2ee;
            min-height: 100vh;
            display: grid;
            place-items: center;
            -webkit-font-smoothing: antialiased;
        }
        .login-card {
            width: min(420px, 92vw);
            background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.025));
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 24px;
            padding: 40px 36px;
            backdrop-filter: blur(20px);
            box-shadow: 0 40px 100px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.07);
        }
        .brand-badge {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 12px; font-weight: 600; color: #5ee26b;
            background: rgba(94,226,107,.12);
            border: 1px solid rgba(94,226,107,.3);
            padding: 6px 12px; border-radius: 999px; margin-bottom: 24px;
        }
        .brand-badge::before {
            content: ""; width: 6px; height: 6px; border-radius: 50%;
            background: #5ee26b; box-shadow: 0 0 8px #5ee26b;
        }
        h1 { font-size: 28px; line-height: 1.15; letter-spacing: -.02em; font-weight: 600; margin-bottom: 8px; }
        .muted { color: #8a948c; font-size: 14px; line-height: 1.55; margin-bottom: 30px; }
        label { display: block; font-size: 13px; color: #8a948c; margin-bottom: 8px; }
        input[type="password"] {
            width: 100%;
            background: rgba(0,0,0,.45);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 12px;
            color: #eef2ee; font: inherit; font-size: 15px;
            padding: 13px 15px; outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        input[type="password"]::placeholder { color: #5a625c; }
        input[type="password"]:focus {
            border-color: rgba(94,226,107,.55);
            box-shadow: 0 0 0 4px rgba(94,226,107,.08);
        }
        .error-msg {
            margin-top: 10px; font-size: 13px; color: #ffb4b4;
            background: rgba(255,90,90,.08);
            border: 1px solid rgba(255,90,90,.3);
            border-radius: 10px; padding: 10px 12px;
        }
        button[type="submit"] {
            margin-top: 20px; width: 100%; border: none; cursor: pointer;
            background: linear-gradient(145deg, #6ff07b, #2f9e3f);
            color: #04120a; font: inherit; font-weight: 600; font-size: 15px;
            border-radius: 12px; padding: 14px;
            box-shadow: 0 8px 26px rgba(94,226,107,.28), inset 0 1px 0 rgba(255,255,255,.35);
            transition: transform .15s, filter .15s;
        }
        button[type="submit"]:hover { transform: translateY(-1px); filter: brightness(1.08); }
        :focus-visible { outline: 2px solid #5ee26b; outline-offset: 2px; }
        .footer-note { margin-top: 22px; text-align: center; font-size: 12px; color: #5a625c; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-badge">FDE Project</div>
        <h1>IT Support<br>Agentic RAG</h1>
        <p class="muted">Enter your access password to continue.</p>

        <form method="post" action="/login">
            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter password..."
                autofocus
                required
            />
            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}
            <button type="submit">Sign in</button>
        </form>

        <p class="footer-note">Enterprise Knowledge Copilot · Agentic RAG</p>
    </div>
</body>
</html>
