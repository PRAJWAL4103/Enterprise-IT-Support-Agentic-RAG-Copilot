<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — {{ app_name | default("IT Support Copilot") }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/style.css?v=14" />
    <script>
        // Synchronously initialize theme to avoid flash
        (function() {
            const params = new URLSearchParams(window.location.search);
            const urlTheme = params.get('theme');
            const saved = urlTheme || localStorage.getItem('it_copilot_theme');
            if (saved === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            } else if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>
<body>

<!-- Halftone Grid & Noise Overlays -->
<div class="halftone-overlay" aria-hidden="true"></div>
<div class="noise-overlay" aria-hidden="true"></div>

<div class="login-page-wrap">
    <!-- Top-Right Theme Toggle -->
    <header class="login-topbar">
        <button type="button" class="theme-toggle-btn" id="themeToggle" aria-label="Toggle light or dark theme" title="Toggle theme">
            <!-- Sun icon (shown in dark mode) -->
            <svg class="icon-sun" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="display:none;">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <!-- Moon icon (shown in light mode) -->
            <svg class="icon-moon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </header>

    <!-- Centered Login Card -->
    <main class="login-card {% if error %}has-error{% endif %}">
        <!-- Rounded-square glass logo tile -->
        <div class="login-logo-tile" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                <path d="M2 17l10 5 10-5"></path>
                <path d="M2 12l10 5 10-5"></path>
            </svg>
        </div>

        <h1>Welcome Back</h1>
        <p class="login-subtitle">Sign in to continue to IT Copilot</p>

        {% if error %}
        <div class="error-msg" role="alert">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form class="login-form" method="post" action="/login" id="loginForm">
            <div class="field-group">
                <label for="password">Password</label>
                <div class="password-input-wrap">
                    <svg class="lock-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Enter your access password..."
                        autocomplete="current-password"
                        required
                        autofocus
                    />
                    <button type="button" class="eye-toggle-btn" id="eyeToggle" aria-label="Toggle password visibility" title="Show/Hide password">
                        <!-- Eye icon -->
                        <svg class="eye-open" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <!-- Eye-off icon -->
                        <svg class="eye-closed" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="display:none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="neo-btn-primary login-submit-btn" id="submitBtn">
                <span class="btn-text">Login</span>
                <div class="arrow-chip" id="btnChip">
                    <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                    <div class="orbit-spinner" aria-hidden="true">
                        <div class="inner one"></div>
                        <div class="inner two"></div>
                        <div class="inner three"></div>
                    </div>
                </div>
            </button>
        </form>

        <footer class="login-footer">
            Enterprise Knowledge Copilot · Agentic RAG
        </footer>
    </main>
</div>

<script>
    // Theme Switcher for Login
    const themeBtn = document.getElementById('themeToggle');
    const sunIcon = themeBtn.querySelector('.icon-sun');
    const moonIcon = themeBtn.querySelector('.icon-moon');

    function syncThemeIcons() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) {
            sunIcon.style.display = 'block';
            moonIcon.style.display = 'none';
        } else {
            sunIcon.style.display = 'none';
            moonIcon.style.display = 'block';
        }
    }
    syncThemeIcons();

    themeBtn.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('it_copilot_theme', next);
        syncThemeIcons();
    });

    // Eye toggle for password visibility
    const passwordInput = document.getElementById('password');
    const eyeToggle = document.getElementById('eyeToggle');
    const eyeOpen = eyeToggle.querySelector('.eye-open');
    const eyeClosed = eyeToggle.querySelector('.eye-closed');

    eyeToggle.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeOpen.style.display = 'none';
            eyeClosed.style.display = 'block';
        } else {
            passwordInput.type = 'password';
            eyeOpen.style.display = 'block';
            eyeClosed.style.display = 'none';
        }
        passwordInput.focus();
    });

    // Form submit loading state and animations
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const loginCard = document.querySelector('.login-card');
    const btnText = submitBtn.querySelector('.btn-text');

    // Tactile click ripple effect
    submitBtn.addEventListener('click', (e) => {
        const rect = submitBtn.getBoundingClientRect();
        const ripple = document.createElement('span');
        ripple.className = 'btn-ripple';
        const size = Math.max(rect.width, rect.height) * 1.6;
        ripple.style.width = ripple.style.height = `${size}px`;
        ripple.style.left = `${e.clientX - rect.left - size / 2}px`;
        ripple.style.top = `${e.clientY - rect.top - size / 2}px`;
        submitBtn.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
    });

    let isSubmitting = false;
    loginForm.addEventListener('submit', (e) => {
        if (isSubmitting) return;
        e.preventDefault();
        isSubmitting = true;

        // Trigger animations immediately
        submitBtn.classList.add('is-submitting');
        if (loginCard) loginCard.classList.add('is-authenticating');
        if (btnText) btnText.textContent = 'Authenticating...';

        // Brief delay allowing the glowing 3D gyroscope & border-beam animation to play smoothly
        setTimeout(() => {
            loginForm.submit();
        }, 550);
    });
</script>
</body>
</html>
