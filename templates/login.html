<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — IT Support Copilot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
            background: #2d232e;
            color: #f1f0ea;
            min-height: 100vh;
            display: grid;
            place-items: center;
        }
        .login-card {
            width: min(420px, 92vw);
            background: #3a3038;
            border: 1px solid #534b52;
            border-radius: 20px;
            padding: 40px 36px;
        }
        .brand-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .16em;
            background: #2d232e;
            color: #e0ddcf;
            padding: 7px 9px;
            border-radius: 7px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 26px;
            line-height: 1.1;
            margin-bottom: 8px;
            color: #f1f0ea;
        }
        .muted {
            color: #e0ddcf;
            font-size: 14px;
            line-height: 1.55;
            margin-bottom: 32px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #e0ddcf;
            margin-bottom: 7px;
        }
        input[type="password"] {
            width: 100%;
            background: #474448;
            border: 1px solid #534b52;
            border-radius: 10px;
            color: #f1f0ea;
            font: inherit;
            font-size: 15px;
            padding: 12px 14px;
            outline: none;
            transition: border-color .2s;
        }
        input[type="password"]::placeholder {
            color: #8c848a;
        }
        input[type="password"]:focus {
            border-color: #e0ddcf;
        }
        .error-msg {
            margin-top: 10px;
            font-size: 13px;
            color: #f1f0ea;
            background: #474448;
            border: 1px solid #6b6069;
            border-radius: 8px;
            padding: 10px 12px;
        }
        button[type="submit"] {
            margin-top: 20px;
            width: 100%;
            border: none;
            background: #e0ddcf;
            color: #2d232e;
            font-weight: 800;
            font-size: 15px;
            border-radius: 11px;
            padding: 13px;
            cursor: pointer;
            transition: background .2s;
        }
        button[type="submit"]:hover { background: #f1f0ea; }
        .footer-note {
            margin-top: 22px;
            text-align: center;
            font-size: 12px;
            color: #8c848a;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-badge">FDE Project</div>
        <h1>IT Support<br>Agentic RAG</h1>
        <p class="muted">Enter your access password to continue.</p>

        <form method="post" action="/login">
            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter password..."
                autofocus
                required
            />
            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}
            <button type="submit">Sign In →</button>
        </form>

        <p class="footer-note">Enterprise Knowledge Copilot · Agentic RAG</p>
    </div>
</body>
</html>
